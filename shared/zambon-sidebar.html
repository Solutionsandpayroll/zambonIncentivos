<!--
  Zambon OS — Sidebar canónico.
  Copia este <aside> en cada página. Para marcar la página actual, añade la clase
  "z-nav-item--active" y aria-current="page" al <a> correspondiente, y pon su
  icono en font-variation-settings: 'FILL' 1. Los demás quedan como .z-nav-item.

  La navegación va en ESPAÑOL (docs/diseno/diseno-frontend.md §4):
    Inicio · Cálculo · Resultados · Reportes · Admin
  Iconos fijos por destino:

  Destinos: ../home/code.html, ../calculof/code.html, ../resultsf/code.html,
            ../reportesf/code.html, ../adminf/code.html

  PERFIL: el nombre y el rol NO se escriben a mano. Los rellena

  marcador '—' que se ve mientras carga; un nombre quemado ahí sería un dato

  PERMISOS: `ZambonAPI.requireAuth()` retira del menú las secciones que el rol
  no puede ver (applyNavPermissions), así que aquí no se condiciona nada.
